<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="folio-fixture" content="synthetic">
<title>Synthetic fixture: Repeated exchanges - Claude</title>
<style>
  body { margin: 0; font: 16px/1.5 sans-serif; }
  .scroller { height: 100vh; overflow-y: auto; }
  .turn { max-width: 720px; margin: 0 auto; padding: 16px; min-height: 70vh; }
  .fixture-banner { background: #fee2e2; padding: 4px 8px; font-size: 12px; }
</style>
</head>
<body>
<!--
  SYNTHETIC TEST FIXTURE for Folio. Hand-written; NOT captured from claude.ai; no real user data.
  Two fully identical exchanges: the same prompt and the same reply, twice. Their text and their
  neighbours cannot tell them apart, so only live identity (which entry was clicked) can.
-->
<div class="fixture-banner" role="note">Synthetic test fixture modelled on claude.ai. Not real claude.ai content.</div>
<main class="scroller">
  <div class="conversation" id="conversation">
    <div data-test-render-count="1" class="turn">
      <div class="group"><div data-testid="user-message" class="font-user-message"><p>Continue</p></div></div>
    </div>
    <div data-test-render-count="1" class="turn">
      <div data-is-streaming="false" class="group">
        <div class="font-claude-response"><div class="standard-markdown"><p>Done.</p></div></div>
      </div>
    </div>
    <div data-test-render-count="1" class="turn">
      <div class="group"><div data-testid="user-message" class="font-user-message"><p>Continue</p></div></div>
    </div>
    <div data-test-render-count="1" class="turn">
      <div data-is-streaming="false" class="group">
        <div class="font-claude-response"><div class="standard-markdown"><p>Done.</p></div></div>
      </div>
    </div>
  </div>
</main>
</body>
</html>
